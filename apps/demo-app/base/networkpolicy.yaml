apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: demo-app-networkpolicy
spec:
  podSelector:
    matchLabels:
      app: demo-app
  policyTypes:
    - Ingress
  ingress:
    # 1. Allow traffic from the NGINX controller's namespace
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8080
          protocol: TCP
    # 2. Allow Argo Rollouts to query the health endpoints locally
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: argocd